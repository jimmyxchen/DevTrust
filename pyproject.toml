[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devtrust"
version = "1.0.0"
description = "DevTrust - Uncover the truth behind GitHub stars. Detect fake/botted stars using multi-signal analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DevTrust Contributors"},
]
keywords = ["github", "stars", "fake-stars", "bot-detection", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyGithub>=2.1.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "click>=8.1",
    "scikit-learn>=1.3.0",
    "cachetools>=5.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
devtrust = "dev_trust.cli:main"

[project.urls]
Homepage = "https://github.com/JimmyChen/DevTrust"
Repository = "https://github.com/JimmyChen/DevTrust"
Issues = "https://github.com/JimmyChen/DevTrust/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dev_trust*"]

[tool.setuptools.package-data]
dev_trust = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
